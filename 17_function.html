<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function in JavaScript</title>
</head>
<body>
    
    <h2 id="user"></h2>
    <script>
        const user = {
            firstName : "Jayanti",
            lastName:"Thakor",
            fullName : function(){
                return this.firstName + " "+this.lastName;
            }
        }

        document.getElementById('user').innerHTML = user.fullName();
    </script>
</body>
</html>
