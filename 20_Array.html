<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array in JavaScript</title>
</head>
<body>
    
    <h1>Explore Our Courses</h1>
    <h2 id="courseList"></h2>
    <script>
        const courses = ["Cyber Security","Data Science","Full Stack Development","Digital Marketing","Devops"]

        let data = "<ul>";

        for(let x of courses){
            data += "<li>" + x + "</li>";
        }
        data += "</ul>"
        // document.getElementById('courseList').innerHTML = courses[2];
        document.getElementById('courseList').innerHTML = data;

    </script>
</body>
</html>
