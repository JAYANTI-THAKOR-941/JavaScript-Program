<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop in javascript</title>
</head>
<body>
    <h3 id="data"></h3>

    <script>
        let i = 1;
        let text = "";
        while(i<=10){
            text += "<br>student - "+ i;
            i++;
        }
        document.getElementById('data').innerHTML = text;
    </script>
</body>
</html>
