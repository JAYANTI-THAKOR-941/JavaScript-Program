<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else statement in js</title>
</head>
<body>
    <h2 id="msg"></h2>

    <script>
        let isAuth =false

        if(!isAuth){
            alert("\nPlease login..!!")
        }
        else{
            document.getElementById('msg').innerHTML = "welcome user.!"
        }
    </script>
</body>
</html>
