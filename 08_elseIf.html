<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Else if Ladder Statement</title>
</head>
<body>
    
    <h2 id="msg"></h2>
    <script>
        let role = prompt("Enter your role:")
        // alert("Hello Student")
        // confirm("Are you sure?")
        let msg = "";

        if(role === "admin"){
            msg = "Welcome Admin.!!";
        }
        else if(role === "student"){
            msg = "Welcome Student";
        }
        else if(role === "teacher"){
            msg = "Welcome Teacher";
        }
        else{
            msg = "Invalid Role..!";
        }

        document.getElementById('msg').innerHTML = msg;
    </script>
</body>
</html>
