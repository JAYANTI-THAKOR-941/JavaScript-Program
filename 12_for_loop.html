<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop in javascript</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .product-container{
            display: flex;
            padding: 30px;
        }
        .product-img img{
            width: 100%;
        }
        .product-desc{
            margin: 20px;
        }
        .product-desc h3{
            margin: 10px 0;
            font-size: 30px;
        }
        .product-desc p{
            margin: 10px 0;
        }
        b{
            color: purple;
        }
        li{
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <div class="product-img">
            <img src="https://www.orionphotogroup.com/wp-content/uploads/2023/09/OPG-Blog-Best-Professional-Canon-Cameras-That-Should-Be-On-Every-Photographers-List-10-12-2023-scaled.jpg" alt="">
        </div>
        <div class="product-desc">
            <h3>Canon EOS R50</h3>
            <p>Canon EOS R50 RF-S18-45mm f/4.5-6.3 is STM Mirrorless Camera (Black)- 4K Video Vlogging with 24.2 MP</p>
            <p><b>Price:</b> ₹63,799</p>
            <p><b>Available Colors:</b>Black and Silver</p>
            <p><b>Key Features:</b></p>
            <ul id="feature-list"></ul>
        </div>
    </div>

    <script>
        let features = [
            "Better battery life",
            "Higher storage/memory options",
            "Improved camera quality",
            "5G or faster connectivity",
            "Enhanced security features",
            "AI-assisted functionalities",
        ]

        for(let x of features){
            features += "<li>" + x + "</li>"
        }
        document.getElementById("feature-list").innerHTML = features
    </script>
    
</body>
</html>
